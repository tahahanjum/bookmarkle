<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>New Tab</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wallpaper"></div>
  <div id="wallpaper-tint"></div>

  <header id="topbar">
    <div class="topbar-inner">
      <div class="pages-row" id="pages"></div>

      <div id="clock"><span id="clock-time">--:--</span></div>

      <form id="search" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="search-input" type="text" placeholder="Search..." spellcheck="false" aria-label="Search">
        <button type="button" id="search-clear" title="Clear" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div id="search-suggest" role="listbox" aria-label="Search suggestions"></div>
      </form>
    </div>
    <div id="topbar-rule"></div>
  </header>

  <main id="grid"></main>

  <nav id="rail">
    <span id="rail-group">
      <button class="rail-btn" id="btn-data" title="Export / import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
      </button>
      <button class="rail-btn" id="btn-private" title="Privacy blur">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="14" r="3.4"/><circle cx="17" cy="14" r="3.4"/><path d="M10.4 14h3.2"/><path d="M2.6 10.4h4.8M16.6 10.4h4.8"/></svg>
      </button>
      <button class="rail-btn" id="btn-select" title="Select bookmarks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><path d="M14 17.5l2.2 2.2L21 15"/></svg>
      </button>
      <button class="rail-btn" id="btn-trash" title="Trash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.6h6V7"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
      <button class="rail-btn" id="btn-clock-edit" title="Customize clock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.2" cy="10.2" r="7.2"/><path d="M10.2 6.4v3.8l2.4 1.4"/><path d="M20.6 14.8l-5.2 5.2-2.6.6.6-2.6 5.2-5.2a1.25 1.25 0 011.8 0l.2.2a1.25 1.25 0 010 1.8z"/></svg>
      </button>
      <button class="rail-btn" id="btn-zen" title="Hide interface">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-6.4 10-6.4S22 12 22 12s-3.6 6.4-10 6.4S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      </button>
    </span>
    <button class="rail-btn rail-toggle accent" id="btn-rail-toggle" title="More tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="rail-btn accent" id="btn-settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.6 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1v.3a2 2 0 11-4 0v-.2a1.6 1.6 0 00-2.8-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7h-.3a2 2 0 110-4h.2a1.6 1.6 0 001.1-2.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3h.1a1.6 1.6 0 001-1.5v-.3a2 2 0 114 0v.2a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8v.1a1.6 1.6 0 001.5 1h.3a2 2 0 110 4h-.2a1.6 1.6 0 00-1.5 1z"/></svg>
    </button>
  </nav>

  <button id="wallpaper-btn" title="Wallpaper">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.4"/><circle cx="8.6" cy="10" r="1.6"/><path d="M4 17l4.6-4.4 3.4 3 3-2.6L20 17"/></svg>
  </button>

  <div id="select-bar">
    <span id="select-count">0 selected</span>
    <button class="btn btn-sm" id="sel-open">Open all</button>
    <select class="select btn-sm" id="sel-move" style="min-width:150px"><option value="">Move to board...</option></select>
    <button class="btn btn-sm btn-danger" id="sel-delete">Delete</button>
    <button class="btn btn-sm" id="sel-done">Done</button>
  </div>

  <section id="wp-panel">
    <div class="wp-head">
      <h3>Style</h3>
      <div class="seg">
        <button id="mode-dark">Dark</button>
        <button id="mode-light">Light</button>
      </div>
    </div>
    <div class="wp-scroll" id="wp-scroll"></div>
    <div class="wp-foot">
      <button class="btn" id="wp-upload">Upload Wallpaper</button>
      <button class="btn" id="wp-more">More Wallpapers</button>
    </div>
    <input type="file" id="wp-file" accept="image/*" hidden>
  </section>

  <div class="overlay" id="overlay"><div id="overlay-content"></div></div>

  <div id="zen-exit"><span>Click anywhere to bring the interface back</span></div>

  <div id="toasts"></div>

  <script src="js/color.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
